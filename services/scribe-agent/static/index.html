<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clinical Scribe</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1c2430; --muted: #5d6b7c; --line: #dfe4ea;
    --accent: #0b6e69; --accent-ink: #ffffff; --warn: #9a5b00; --warn-bg: #fff4e0; --ok: #1e7a3c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11161c; --panel: #19202a; --ink: #e6ebf1; --muted: #93a1b2; --line: #2a3442;
            --accent: #3fb8af; --accent-ink: #0b1215; --warn: #f3b562; --warn-bg: #2b2112; --ok: #5ccf85; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; background: var(--bg); color: var(--ink); }
  header { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; gap: 8px; }
  header h1 { font-size: 16px; margin: 0; }
  header .meta { color: var(--muted); font-size: 12px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  main { display: grid; grid-template-columns: 280px 1fr 360px; gap: 16px; padding: 16px 20px; }
  @media (max-width: 1100px) { main { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; min-width: 0; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; }
  input, textarea, button { font: inherit; color: inherit; }
  input, textarea { width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
  textarea { resize: vertical; }
  button { padding: 8px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; margin: 8px 0; flex-wrap: wrap; align-items: center; }
  ul.patients { list-style: none; margin: 8px 0 0; padding: 0; max-height: 60vh; overflow: auto; }
  ul.patients li { padding: 8px; border-radius: 6px; cursor: pointer; }
  ul.patients li:hover { background: var(--bg); }
  ul.patients li.sel { background: var(--accent); color: var(--accent-ink); }
  ul.patients small { display: block; opacity: .75; }
  .steps { list-style: none; padding: 0; margin: 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .steps li { padding: 6px 0; border-bottom: 1px dashed var(--line); word-break: break-word; }
  .steps .t { color: var(--accent); font-weight: 600; }
  .status { color: var(--muted); font-size: 12px; }
  .flags { background: var(--warn-bg); color: var(--warn); border-radius: 6px; padding: 8px 10px; white-space: pre-wrap; margin-top: 8px; }
  .ok { color: var(--ok); }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  td, th { text-align: left; padding: 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
</style>
</head>
<body>
<header>
  <div>
    <h1 id="hospital">Clinical Scribe</h1>
    <div class="meta">Synthetic data only. Every note requires clinician review and signature.</div>
  </div>
  <div class="row">
    <span class="badge" id="model">model</span>
    <span class="badge" id="inference">inference</span>
  </div>
</header>
<main>
  <section>
    <h2>Patients</h2>
    <input id="q" placeholder="Search by name">
    <ul class="patients" id="patients"></ul>
  </section>

  <section>
    <h2>Encounter</h2>
    <div class="status" id="patientLabel">Select a patient.</div>
    <div class="row">
      <input type="file" id="audio" accept="audio/*" style="flex:1">
      <button id="transcribeBtn">Transcribe audio</button>
      <button id="sampleBtn">Load sample encounter</button>
    </div>
    <textarea id="transcript" rows="9" placeholder="Transcript of the encounter"></textarea>
    <div class="row">
      <button class="primary" id="draftBtn" disabled>Draft note</button>
      <span class="status" id="status"></span>
    </div>
    <h2 style="margin-top:16px">Draft note</h2>
    <textarea id="note" rows="18" placeholder="The agent's draft appears here. Edit before signing."></textarea>
    <div class="row">
      <input id="clinician" style="flex:1">
      <button class="primary" id="signBtn" disabled>Sign and save to chart</button>
    </div>
    <div class="status" id="signStatus"></div>
  </section>

  <section>
    <h2>Agent activity</h2>
    <ul class="steps" id="steps"><li class="status">Tool calls appear here while the agent reads the chart.</li></ul>
    <h2 style="margin-top:16px">Audit log</h2>
    <table><thead><tr><th>Time</th><th>Actor</th><th>Event</th></tr></thead><tbody id="audit"></tbody></table>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let patient = null, draftId = null;

const SAMPLE = `Doctor: Good morning. What brings you in today?
Patient: I've been more tired than usual for about three weeks, and I'm getting up at night to pee two or three times.
Doctor: Any chest pain, shortness of breath, or swelling in your legs?
Patient: No chest pain. My ankles are a little puffy by the evening.
Doctor: Are you taking all of your medications as prescribed?
Patient: Mostly. I ran out of one of my blood pressure pills last week and haven't refilled it. I've also been taking ibuprofen most days for my knee.
Doctor: Your blood pressure today is 152 over 94, heart rate 82. Lungs are clear, there's mild pitting edema at both ankles.
Doctor: I'd like to check your kidney function, A1c and a urine sample today. Let's get the blood pressure medicine refilled, and I'd like you to stop the ibuprofen and use acetaminophen for the knee instead.
Patient: Okay. Should I come back?
Doctor: Yes, let's follow up in two weeks to go over the labs.`;

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

function esc(s) { return String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

async function loadPatients() {
  const list = await api(`/api/patients?q=${encodeURIComponent($("q").value)}`);
  $("patients").innerHTML = list.map((p) =>
    `<li data-id="${esc(p.id)}" data-name="${esc(p.name)}" class="${patient && patient.id === p.id ? "sel" : ""}">
       ${esc(p.name)}<small>${esc(p.gender)} · born ${esc(p.birthDate)} · Patient/${esc(p.id)}</small></li>`).join("")
    || `<li class="status">No patients found. Has the Synthea loader finished?</li>`;
}

$("patients").addEventListener("click", (e) => {
  const li = e.target.closest("li[data-id]");
  if (!li) return;
  patient = { id: li.dataset.id, name: li.dataset.name };
  document.querySelectorAll("#patients li").forEach((x) => x.classList.toggle("sel", x === li));
  $("patientLabel").textContent = `${patient.name} (Patient/${patient.id})`;
  $("draftBtn").disabled = false;
  loadAudit();
});

let qTimer;
$("q").addEventListener("input", () => { clearTimeout(qTimer); qTimer = setTimeout(loadPatients, 250); });
$("sampleBtn").onclick = () => { $("transcript").value = SAMPLE; };

$("transcribeBtn").onclick = async () => {
  const f = $("audio").files[0];
  if (!f) return alert("Choose an audio file first.");
  $("status").textContent = "Transcribing in the hospital account...";
  const fd = new FormData(); fd.append("file", f);
  try {
    const r = await api("/api/transcribe", { method: "POST", body: fd });
    $("transcript").value = r.text;
    $("status").textContent = `Transcribed ${Math.round(r.duration || 0)}s of audio.`;
  } catch (err) { $("status").textContent = `Transcription failed: ${err.message}`; }
};

$("draftBtn").onclick = async () => {
  if (!patient || !$("transcript").value.trim()) return alert("Select a patient and provide a transcript.");
  $("draftBtn").disabled = true; $("signBtn").disabled = true; draftId = null;
  $("steps").innerHTML = ""; $("note").value = ""; $("signStatus").textContent = "";
  $("status").textContent = "Agent is reading the chart...";
  const resp = await fetch("/api/notes/draft", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ patient_id: patient.id, transcript: $("transcript").value, clinician: $("clinician").value }),
  });
  const reader = resp.body.getReader(); const dec = new TextDecoder(); let buf = "";
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n\n")) >= 0) {
      const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
      const ev = /event: (.*)/.exec(chunk)?.[1]; const data = JSON.parse(/data: (.*)/s.exec(chunk)?.[1] || "{}");
      if (ev === "tool_call") {
        $("steps").insertAdjacentHTML("beforeend",
          `<li><span class="t">${esc(data.tool)}</span>(${esc(JSON.stringify(data.arguments))}) <span class="status">${data.duration_ms} ms</span></li>`);
      } else if (ev === "done") {
        draftId = data.draft_id; $("note").value = data.note; $("signBtn").disabled = false;
        $("status").textContent = "Draft ready for review.";
      } else if (ev === "error") {
        $("status").textContent = `Agent error: ${data.message}`;
      }
    }
  }
  $("draftBtn").disabled = false;
  loadAudit();
};

$("signBtn").onclick = async () => {
  $("signBtn").disabled = true;
  try {
    const r = await api(`/api/notes/${draftId}/approve`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ note: $("note").value, clinician: $("clinician").value }),
    });
    $("signStatus").innerHTML = `<span class="ok">Signed and saved to the chart as ${esc(r.fhir_reference)}.</span>`;
  } catch (err) { $("signStatus").textContent = `Save failed: ${err.message}`; $("signBtn").disabled = false; }
  loadAudit();
};

async function loadAudit() {
  const rows = await api(`/api/audit${patient ? `?patient_id=${encodeURIComponent(patient.id)}` : ""}`);
  $("audit").innerHTML = rows.slice(0, 40).map((r) =>
    `<tr><td>${esc(new Date(r.ts).toLocaleTimeString())}</td><td>${esc(r.actor)}</td>
     <td>${esc(r.event)}${r.detail?.tool ? `: ${esc(r.detail.tool)}` : ""}${r.detail?.fhir_reference ? ` ${esc(r.detail.fhir_reference)}` : ""}</td></tr>`).join("");
}

(async () => {
  const cfg = await api("/api/config");
  $("hospital").textContent = `Clinical Scribe · ${cfg.hospital}`;
  $("model").textContent = cfg.model;
  $("inference").textContent = cfg.provider === "anthropic"
    ? "Data plane in hospital account · inference via Claude API"
    : "Data plane and inference in hospital account";
  $("clinician").value = cfg.clinician;
  loadPatients(); loadAudit();
})();
</script>
</body>
</html>
