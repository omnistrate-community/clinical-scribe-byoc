# Throwaway Postgres for local testing only. In a real deployment the control
# plane provisions a managed database (RDS, Cloud SQL, Azure Database) in the
# hospital account and passes its endpoint to the chart as global.database.
apiVersion: v1
kind: Secret
metadata:
  name: dev-postgres
stringData:
  username: scribe
  password: scribe-dev-password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-postgres
spec:
  replicas: 1
  selector:
    matchLabels: {app: dev-postgres}
  template:
    metadata:
      labels: {app: dev-postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:17
          env:
            - {name: POSTGRES_DB, value: clinical_scribe}
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: dev-postgres, key: username}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: dev-postgres, key: password}}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: [pg_isready, -U, scribe, -d, clinical_scribe]}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: dev-postgres
spec:
  selector: {app: dev-postgres}
  ports: [{port: 5432}]
