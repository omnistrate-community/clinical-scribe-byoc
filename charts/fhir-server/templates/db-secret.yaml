{{- $db := include "fhir-server.database" . | fromYaml -}}
{{- if not $db.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fhir-server.databaseSecretName" . }}
  labels:
    {{- include "fhir-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ $db.username | quote }}
  password: {{ $db.password | quote }}
{{- end }}
