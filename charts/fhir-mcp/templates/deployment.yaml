apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fhir-mcp.fullname" . }}
  labels:
    {{- include "fhir-mcp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "fhir-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fhir-mcp.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "fhir-mcp.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: fhir-mcp
          image: {{ include "fhir-mcp.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: FHIR_BASE_URL
              value: {{ .Values.fhirBaseUrl | default (printf "http://%s-fhir-server:8080/fhir" .Release.Name) | quote }}
            - name: PORT
              value: "8000"
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- include "fhir-mcp.scheduling" . | nindent 6 }}
