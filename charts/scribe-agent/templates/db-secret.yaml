{{- $db := include "scribe-agent.database" . | fromYaml -}}
{{- if not $db.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "scribe-agent.databaseSecretName" . }}
  labels:
    {{- include "scribe-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ $db.username | quote }}
  password: {{ $db.password | quote }}
{{- end }}
