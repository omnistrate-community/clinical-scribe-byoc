{{- $llm := include "scribe-agent.llm" . | fromYaml -}}
{{- if and $llm.apiKey (not $llm.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "scribe-agent.fullname" . }}-llm
  labels:
    {{- include "scribe-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ $llm.apiKey | quote }}
{{- end }}
