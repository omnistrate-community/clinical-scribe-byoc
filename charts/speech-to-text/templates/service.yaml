apiVersion: v1
kind: Service
metadata:
  name: {{ include "speech-to-text.fullname" . }}
  labels:
    {{- include "speech-to-text.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "speech-to-text.selectorLabels" . | nindent 4 }}
